    value: "1"
    availability:
      - BUILD

  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBkmcVQsgTXcC5Emf0OH9gNvBsKcWcYOCE"
    availability:
      - BUILD
      - RUNTIME
